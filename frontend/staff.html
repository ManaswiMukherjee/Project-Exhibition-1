<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Panel - QR Scanner</title>
  <link rel="stylesheet" href="lib/local.css">
  <script src="lib/html5-qrcode.min.js" type="text/javascript"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 flex flex-col items-center">

  <!-- Full-screen flash overlay for scan feedback -- sits above everything,
       ignores touches, briefly flashes a color then fades out. Exists
       because on a small phone screen, the scan-log entry alone is easy
       to miss at a busy counter; this is impossible to miss. -->
  <div id="flashOverlay" style="position:fixed; inset:0; pointer-events:none; opacity:0; transition:opacity 0.15s ease; z-index:9999;"></div>

  <div class="bg-white p-6 rounded-xl shadow-lg max-w-md w-full">
    <h2 class="text-2xl font-bold text-center text-emerald-600 mb-1">Staff Panel - QR Scanner</h2>
    <p class="text-xs text-gray-400 text-center mb-4">Scan a slip's QR twice: once when food's ready, once at handoff.</p>

    <div class="mb-4 flex gap-2">
      <button id="startBtn" onclick="startCamera()"
              class="w-full bg-emerald-600 text-white py-3 rounded-lg font-semibold hover:bg-emerald-700 transition">
        Open Camera to Scan
      </button>
      <button id="stopBtn" onclick="stopCamera()"
              class="w-full bg-red-500 text-white py-3 rounded-lg font-semibold hover:bg-red-600 transition hidden">
        Stop Camera
      </button>
    </div>

    <div id="reader" class="w-full rounded-lg overflow-hidden border bg-gray-50 min-h-[250px] flex items-center justify-center text-gray-400 text-sm">
      Tap "Open Camera to Scan" to start
    </div>

    <!-- Running log of scan results. Each successful decode auto-submits;
         nothing here waits on a manual confirm button. -->
    <div class="mt-6">
      <h3 class="font-bold text-gray-700 text-sm mb-2">Recent Scans</h3>
      <div id="scanLog" class="space-y-2 max-h-64 overflow-y-auto"></div>
    </div>
  </div>

  <script>
    // ---- Backend connection ------------------------------------------
    // Relative URL -- works because staff.html is served by the same
    // FastAPI app (via StaticFiles at /app) that hosts /scan.
    const BASE_URL = "";

    let html5QrCode = null;
    let isProcessing = false;        // true while a scan is in-flight to the backend
    let lastScanId = null;
    let lastScanTime = 0;
    const RESCAN_COOLDOWN_MS = 3000; // ignore repeat reads of the *same* QR within this window

    // Called by html5-qrcode on every successful frame decode -- this can
    // fire many times a second while a QR stays in view, so debouncing is
    // required, not optional.
    function onScanSuccess(decodedText) {
      if (isProcessing) return;

      let payload;
      try {
        payload = JSON.parse(decodedText);
      } catch (e) {
        logResult('error', 'Invalid QR code (not valid order data).');
        return;
      }

      if (!payload.id || !payload.cname || !payload.order_contents) {
        logResult('error', 'QR is missing expected fields (id / cname / order_contents).');
        return;
      }

      const now = Date.now();
      if (payload.id === lastScanId && (now - lastScanTime) < RESCAN_COOLDOWN_MS) {
        return; // same slip still in frame, already handled -- ignore
      }

      submitScan(payload);
    }

    async function submitScan(payload) {
      isProcessing = true;
      lastScanId = payload.id;
      lastScanTime = Date.now();

      try {
        const response = await fetch(`${BASE_URL}/scan`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        const data = await response.json().catch(() => ({}));

        if (response.status === 200 && data.action === 'created') {
          logResult('success', `READY — ${payload.cname} (${payload.id}) added to the ready queue.`);
        } else if (response.status === 200 && data.action === 'updated') {
          logResult('success', `COLLECTED — ${payload.cname} (${payload.id}) handed off.`);
        } else if (response.status === 409) {
          logResult('warning', `Already collected — ${payload.cname} (${payload.id}) was already handed off.`);
        } else if (response.status === 422) {
          logResult('error', `Server rejected this QR's data (${payload.id}).`);
        } else {
          logResult('error', `Unexpected server response (${response.status}) for ${payload.id}.`);
        }
      } catch (error) {
        console.error("Error submitting scan:", error);
        logResult('error', `Can't reach the server — check your connection. (${payload.id})`);
      } finally {
        isProcessing = false;
      }
    }

    function logResult(type, message) {
      const log = document.getElementById('scanLog');
      const entry = document.createElement('div');
      const time = new Date().toLocaleTimeString();
      const styles = {
        success: 'bg-emerald-50 border-emerald-300 text-emerald-800',
        warning: 'bg-amber-50 border-amber-300 text-amber-800',
        error:   'bg-red-50 border-red-300 text-red-800',
      };
      entry.className = `p-2 rounded border text-sm ${styles[type] || styles.error}`;
      entry.innerText = `[${time}] ${message}`;
      log.prepend(entry);

      flashFeedback(type);
    }

    // Full-screen color flash + vibration, so a scan result is unmissable
    // even on a small screen at a busy, noisy counter. Vibration patterns
    // differ by outcome so staff can tell success from error by feel alone
    // without even looking at the screen. navigator.vibrate is Android-only
    // (no-op on iOS Safari, which is fine -- this is an Android staff phone).
    function flashFeedback(type) {
      const overlay = document.getElementById('flashOverlay');
      const flashColors = {
        success: 'rgba(16, 185, 129, 0.55)',  // green
        warning: 'rgba(245, 158, 11, 0.55)',  // amber
        error:   'rgba(239, 68, 68, 0.55)',   // red
      };
      const vibratePatterns = {
        success: [80],
        warning: [80, 60, 80],
        error: [200, 80, 200],
      };

      overlay.style.background = flashColors[type] || flashColors.error;
      overlay.style.opacity = '1';
      setTimeout(() => { overlay.style.opacity = '0'; }, 180);

      if (navigator.vibrate) {
        navigator.vibrate(vibratePatterns[type] || vibratePatterns.error);
      }
    }

    async function startCamera() {
      try {
        if (!html5QrCode) {
          html5QrCode = new Html5Qrcode("reader");
        }
        const config = { fps: 10, qrbox: { width: 250, height: 250 } };
        await html5QrCode.start(
          { facingMode: "environment" },
          config,
          onScanSuccess,
          (errorMessage) => { /* per-frame scan misses are expected, ignore */ }
        );
        document.getElementById('startBtn').classList.add('hidden');
        document.getElementById('stopBtn').classList.remove('hidden');
      } catch (err) {
        // --- TEMPORARY DEBUG VERSION ---
        // Shows the real error name/message instead of a generic guess,
        // so we can tell permission-denied apart from no-camera-found,
        // apart from some other failure. Revert to a friendlier message
        // once the real cause is confirmed.
        console.error("Camera start failed:", err);
        alert(
          "Camera start failed.\n\n" +
          "Error name: " + (err && err.name) + "\n" +
          "Error message: " + (err && err.message) + "\n\n" +
          "(Temporary debug alert -- shows the real error instead of a generic message.)"
        );
      }
    }

    async function stopCamera() {
      if (html5QrCode) {
        await html5QrCode.stop();
        document.getElementById('startBtn').classList.remove('hidden');
        document.getElementById('stopBtn').classList.add('hidden');
        document.getElementById('reader').innerText = 'Tap "Open Camera to Scan" to start';
      }
    }
  </script>
</body>
</html>
